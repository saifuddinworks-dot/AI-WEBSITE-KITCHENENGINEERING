<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Path for top curved text: KITCHEN ENGINEERING -->
    <path id="topTextArc" d="M 52,200 A 148,148 0 1,1 348,200" fill="none" />
    <!-- Path for bottom curved text: D.A.T CONTRACTOR BUILDERS & SUPPLIERS -->
    <path id="bottomTextArc" d="M 348,200 A 148,148 0 0,1 52,200" fill="none" />
  </defs>

  <!-- Outer Industrial Calibration Bezel / 24 Notches -->
  <g id="calibration-notches">
    <line x1="200" y1="2" x2="200" y2="14" stroke="#D9642C" stroke-width="3" stroke-linecap="round" />
    <line x1="200" y1="386" x2="200" y2="398" stroke="#D9642C" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="200" x2="14" y2="200" stroke="#D9642C" stroke-width="3" stroke-linecap="round" />
    <line x1="386" y1="200" x2="398" y2="200" stroke="#D9642C" stroke-width="3" stroke-linecap="round" />
    
    <!-- Diagonal notches -->
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(15 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(30 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(45 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(60 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(75 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(105 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(120 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(135 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(150 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(165 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(195 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(210 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(225 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(240 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(255 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(285 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(300 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(315 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(330 200 200)" />
    <line x1="200" y1="6" x2="200" y2="12" stroke="#20241E" stroke-width="1.8" stroke-linecap="round" transform="rotate(345 200 200)" />
  </g>

  <!-- Outer Concentric Engineered Rings -->
  <circle cx="200" cy="200" r="186" fill="none" stroke="#20241E" stroke-width="6.5" />
  <circle cx="200" cy="200" r="177" fill="none" stroke="#20241E" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6" />
  <circle cx="200" cy="200" r="122" fill="none" stroke="#20241E" stroke-width="4.5" />
  <circle cx="200" cy="200" r="115" fill="none" stroke="#20241E" stroke-width="1.2" opacity="0.5" />

  <!-- Cardinal Coordinates Pins -->
  <circle cx="200" cy="18" r="2.5" fill="#D9642C" />
  <circle cx="382" cy="200" r="2.5" fill="#D9642C" />
  <circle cx="200" cy="382" r="2.5" fill="#D9642C" />
  <circle cx="18" cy="200" r="2.5" fill="#D9642C" />

  <!-- Precision Industrial Stars with Orange Diamond Center -->
  <!-- Left Star Anchor -->
  <g transform="translate(44, 200)">
    <polygon points="0,-8 2.2,-2.6 8,-2.6 3.4,0.8 5,6.5 0,3.2 -5,6.5 -3.4,0.8 -8,-2.6 -2.2,-2.6" fill="#D9642C" />
    <circle cx="0" cy="0" r="1.5" fill="#20241E" />
  </g>
  <!-- Right Star Anchor -->
  <g transform="translate(356, 200)">
    <polygon points="0,-8 2.2,-2.6 8,-2.6 3.4,0.8 5,6.5 0,3.2 -5,6.5 -3.4,0.8 -8,-2.6 -2.2,-2.6" fill="#D9642C" />
    <circle cx="0" cy="0" r="1.5" fill="#20241E" />
  </g>

  <!-- Top Curved Text: KITCHEN ENGINEERING -->
  <text fill="#20241E" font-family="'Manrope', 'Arial Black', sans-serif" font-weight="900" font-size="26.5" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      KITCHEN ENGINEERING
    </textPath>
  </text>

  <!-- Bottom Curved Text: D.A.T CONTRACTOR BUILDERS & SUPPLIERS -->
  <text fill="#20241E" font-family="'Manrope', 'Arial', sans-serif" font-weight="800" font-size="15.5" letter-spacing="2.8">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      D.A.T CONTRACTOR BUILDERS &amp; SUPPLIERS
    </textPath>
  </text>

  <!-- CENTER EMBLEM: The Iconic Architectural Geometric "KE" Monogram -->
  <g id="ke-monogram" transform="translate(126, 126)">
    <!-- Technical drafting guidelines -->
    <line x1="0" y1="74" x2="148" y2="74" stroke="#20241E" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3" />
    <line x1="74" y1="0" x2="74" y2="148" stroke="#20241E" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3" />

    <!-- Letter K: Left Double Pillars -->
    <rect x="10" y="10" width="13" height="128" rx="1.5" fill="#20241E" />
    <rect x="29" y="10" width="13" height="128" rx="1.5" fill="#20241E" />

    <!-- Letter K: Upper Limbs -->
    <path d="M 48,72 L 88,24 L 112,24 L 68,79 Z" fill="#20241E" />
    <path d="M 68,89 L 99,50 L 112,50 L 81,89 Z" fill="#20241E" />

    <!-- Letter K: Lower Limbs -->
    <path d="M 48,72 L 68,64 L 112,124 L 88,124 Z" fill="#20241E" />
    <path d="M 60,84 L 97,138 L 112,138 L 74,84 Z" fill="#20241E" />

    <!-- Letter E: Triple Double-Bars -->
    <rect x="68" y="10" width="76" height="12" rx="1.5" fill="#20241E" />
    <rect x="68" y="27" width="76" height="11" rx="1.5" fill="#20241E" />

    <rect x="68" y="66" width="64" height="11" rx="1.5" fill="#20241E" />
    <rect x="68" y="81" width="64" height="11" rx="1.5" fill="#20241E" />

    <rect x="68" y="114" width="76" height="11" rx="1.5" fill="#20241E" />
    <rect x="68" y="129" width="76" height="12" rx="1.5" fill="#20241E" />

    <!-- Central Signal Orange Engineering Spark Diamond -->
    <polygon points="58,74 65,67 72,74 65,81" fill="#D9642C" stroke="#ECE5D2" stroke-width="1.5" />
  </g>
</svg>
